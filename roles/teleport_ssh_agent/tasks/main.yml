---
- name: Include the teleport_semaphore role
  ansible.builtin.include_role:
    name: teleport_semaphore

- name: Stat the teleport token file
  register: teleport_ssh_agent_token_file
  ansible.builtin.stat:
    path: /etc/teleport.token

- name: If teleport token file does not exist
  when: not teleport_ssh_agent_token_file.stat.exists
  block:
    - name: Set random token value
      ansible.builtin.set_fact:
        teleport_ssh_agent_token: "{{ 999999999999999999999999999999999999999999999999999999999999999999 | random | to_uuid }}"

    - name: Issue node token
      changed_when: true
      delegate_to: "{{ teleport_semaphore_executor }}"
      ansible.builtin.command:
        cmd: "{{ teleport_semaphore_exec_prefix }} tctl tokens add --type=node,app,db,windowsdesktop,discovery --value {{ teleport_ssh_agent_token }}"

    - name: Place token file
      ansible.builtin.copy:
        dest: /etc/teleport.token
        content: "{{ teleport_ssh_agent_token }}"
        mode: "0600"
        owner: root
        group: root

    - name: Include the teleport_install role
      ansible.builtin.include_role:
        name: teleport_install

    - name: Join node
      changed_when: true
      notify: Restart Teleport # util_common role required in play
      ansible.builtin.command:
        cmd: >
          teleport node configure
            --output file:///etc/teleport.yaml
            --token /etc/teleport.token
            --proxy {{ domain_name }}:443
            --labels hostname={{ ansible_facts.hostname }}
            --labels commonkey=commonvalue
