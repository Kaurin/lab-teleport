- name: End play if terraform_destroy variable is set to any value other than false
  when: terraform_destroy | default(false)
  ansible.builtin.meta: end_play

- name: Wait 600 seconds for target connection to become reachable/usable
  ansible.builtin.wait_for_connection:
    delay: "{{ util_common_conn_wait_first_run | default(true) | ternary(5, 0) }}" # Delay 5 seconds on first run, otherwise don't delay

- name: Set the util_common_conn_wait_first_run to false
  ansible.builtin.set_fact:
    util_common_conn_wait_first_run: false

- name: Gather facts for first time
  retries: 300
  delay: 0
  ansible.builtin.setup:

- name: Wait for cloud init to finish
  community.general.cloud_init_data_facts:
    filter: status
  register: util_common_cloud_init_state
  until: >-
    util_common_cloud_init_state.cloud_init_data_facts.status.v1.stage is defined and
    not util_common_cloud_init_state.cloud_init_data_facts.status.v1.stage
  retries: 120
  delay: 0

- name: Centos and Rocky PATH override block
  # For some reason those cloud distros don't have `/usr/local/bin` in the PATH....
  when: |
    ansible_facts.distribution == "CentOS"
    or ansible_facts.distribution == "Rocky"
  block:
    - name: Add path to /etc/environment
      notify: Reset SSH Connection
      ansible.builtin.lineinfile:
        dest: /etc/environment
        state: present
        regexp: '^PATH=\/usr\/local\/bin'
        line: "PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin"
